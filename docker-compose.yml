services:
  catalog-postgres:
    image: postgres:16
    container_name: eshop-catalog-postgres
    environment:
      POSTGRES_DB: eshop-catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nopolice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop-catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    networks:
      - default
      - microservices-net
  basket-postgres:
    image: postgres:16
    container_name: eshop-basket-postgres
    environment:
      POSTGRES_DB: eshop-basket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nopolice
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop-basket"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_basket_data:/var/lib/postgresql/data
    networks:
      - default
      - microservices-net
  basket-redis:
    image: redis:latest
    container_name: eshop-basket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass nopolice --appendonly yes
    restart: unless-stopped
    networks:
      - microservices-net
  basket-redis-insight:
    image: redis/redisinsight:latest
    container_name: basket-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - basket-redis
    volumes:
      - redisinsight_data:/db
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    build:
      context: .
      dockerfile: Catalog.Api/Dockerfile
    depends_on:
      catalog-postgres:
        condition: service_healthy
    ports:
      - "6000:8080"
      - "6060:8080"
    networks:
      - microservices-net
  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    environment:
      - GrpcSettings__DiscountUrl=http://discount.grpc:8080
    build:
      context: .
      dockerfile: Basket.Api/Dockerfile
    depends_on:
      basket-postgres:
        condition: service_healthy
      basket-redis:
        condition: service_started
      discount.grpc:
        condition: service_started
    ports:
      - "6061:8080"
      - "6001:8080"
    networks:
      - microservices-net
  pgadmin:
    image: dpage/pgadmin4
    container_name: eshop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - catalog-postgres
      - basket-postgres 
  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Discount.gRPC/Dockerfile
    networks:
      - microservices-net
  orderdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    networks:
      - default
      - microservices-net

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    depends_on:
      orderdb:
        condition: service_healthy  
    build:
      context: .
      dockerfile: Ordering.Api/Dockerfile
    networks:
      - microservices-net
  messagebroker:
    image: rabbitmq:management
    networks:
      - default
      - microservices-net

  yarpgateway.api:
    image: ${DOCKER_REGISTRY-}yarpgatewayapi
    build:
      context: .
      dockerfile: YARPGateway.api/Dockerfile
    depends_on:
      catalog.api:
        condition: service_started
      basket.api:
        condition: service_started
      discount.grpc:
        condition: service_started
      ordering.api:
        condition: service_started
      users.api:
        condition: service_started
    ports:
      - "7000:8080"
    networks:
      - microservices-net
  mongodb:
    image: mongo:latest
    container_name: eshop-mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: nopolice
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - microservices-net
  users.api:
    image: ${DOCKER_REGISTRY-}usersapi
    build:
      context: .
      dockerfile: Users.api/Dockerfile
    environment:
      - MongoDBSettings__ConnectionString=mongodb://admin:nopolice@mongodb:27017
      - MongoDBSettings__DatabaseName=eshop-users
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
volumes:
  postgres_catalog_data:
  postgres_basket_data:
  redis_data:
  redisinsight_data:
  discountdata:
  mongo_data:
   




