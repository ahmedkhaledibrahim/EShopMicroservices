services:
  catalog-postgres:
    image: postgres:16
    container_name: eshop-catalog-postgres
    environment:
      POSTGRES_DB: eshop-catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nopolice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop-catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
  basket-postgres:
    image: postgres:16
    container_name: eshop-basket-postgres
    environment:
      POSTGRES_DB: eshop-basket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nopolice
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop-basket"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_basket_data:/var/lib/postgresql/data
  basket-redis:
    image: redis:latest
    container_name: eshop-basket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass nopolice --appendonly yes
    restart: unless-stopped
  basket-redis-insight:
    image: redis/redisinsight:latest
    container_name: basket-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - basket-redis
    volumes:
      - redisinsight_data:/db
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    build:
      context: .
      dockerfile: Catalog.Api/Dockerfile
    depends_on:
      catalog-postgres:
        condition: service_healthy
    ports:
      - "6000:8080"
      - "6060:8080"
  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    environment:
      - GrpcSettings__DiscountUrl=http://discount.grpc:8080
    build:
      context: .
      dockerfile: Basket.Api/Dockerfile
    depends_on:
      basket-postgres:
        condition: service_healthy
      basket-redis:
        condition: service_started
      discount.grpc:
        condition: service_started
    ports:
      - "6061:8080"
      - "6001:8080"
  pgadmin:
    image: dpage/pgadmin4
    container_name: eshop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - catalog-postgres
      - basket-postgres 
  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Discount.gRPC/Dockerfile
  orderdb:
    image: mcr.microsoft.com/mssql/server:2025-latest

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    depends_on:
      orderdb:
        condition: service_healthy  
    build:
      context: .
      dockerfile: Ordering.Api/Dockerfile

volumes:
  postgres_catalog_data:
  postgres_basket_data:
  redis_data:
  redisinsight_data:
  discountdata:
   


